version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trustmark-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmark}
      POSTGRES_DB: ${POSTGRES_DB:-trustmark_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
